name: Apply Preview migrations
description: Apply tested migrations using only the isolated Preview database credentials.
inputs:
  database-url:
    required: true
    description: Direct connection to the isolated Preview database.
  database-host:
    required: true
    description: Expected direct Preview host.
  database-name:
    required: true
    description: Expected Preview database name.
  seed-demo:
    default: "false"
    description: Explicitly populate the isolated Preview with synthetic demo fixtures.
  demo-password:
    default: ""
    description: Generated Preview-only demo admin password.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      with:
        bun-version: 1.3.9
    - run: bun install --frozen-lockfile
      shell: bash
    - name: Apply tested migrations to isolated Preview
      run: bun run db:migrate:release
      shell: bash
      env:
        RELEASE_ENVIRONMENT: preview
        DATABASE_URL_UNPOOLED: ${{ inputs.database-url }}
        RELEASE_DATABASE_HOST: ${{ inputs.database-host }}
        RELEASE_DATABASE_NAME: ${{ inputs.database-name }}
    - name: Populate synthetic Preview demo
      if: inputs.seed-demo == 'true'
      run: bun run scripts/seed-preview-demo.ts
      shell: bash
      env:
        RELEASE_ENVIRONMENT: preview
        DATABASE_URL_UNPOOLED: ${{ inputs.database-url }}
        RELEASE_DATABASE_HOST: ${{ inputs.database-host }}
        RELEASE_DATABASE_NAME: ${{ inputs.database-name }}
        PREVIEW_DEMO_PASSWORD: ${{ inputs.demo-password }}
