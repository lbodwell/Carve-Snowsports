name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carve
          POSTGRES_PASSWORD: carve
          POSTGRES_USER: carve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carve -d carve"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ORIGIN: http://127.0.0.1:3001
      BETTER_AUTH_SECRET: ci-only-secret-must-be-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://carve:carve@127.0.0.1:5432/carve
      TEST_DATABASE_URL: postgresql://carve:carve@127.0.0.1:5432/carve_test
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run test:integration
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
