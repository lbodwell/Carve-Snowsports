name: Preview database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carve-preview-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Apply reviewed main migrations to isolated Preview
        run: bun run db:migrate:release
        env:
          RELEASE_ENVIRONMENT: preview
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          RELEASE_DATABASE_HOST: ${{ vars.RELEASE_DATABASE_HOST }}
          RELEASE_DATABASE_NAME: ${{ vars.RELEASE_DATABASE_NAME }}
