name: Preview database migrations

on:
  workflow_dispatch:
    inputs:
      seed_demo:
        description: Populate synthetic Preview demo data (requires PREVIEW_DEMO_PASSWORD).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: carve-preview-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/preview-migrations
        with:
          database-url: ${{ secrets.DATABASE_URL_UNPOOLED }}
          database-host: ${{ vars.RELEASE_DATABASE_HOST }}
          database-name: ${{ vars.RELEASE_DATABASE_NAME }}
          seed-demo: ${{ inputs.seed_demo }}
          demo-password: ${{ secrets.PREVIEW_DEMO_PASSWORD }}
